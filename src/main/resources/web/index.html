<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>VEIL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23c4b5fd' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/veil.css">
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>

  <main id="stage">
    <button id="orbHit" type="button" aria-label="Open the veil"></button>
    <div id="orbText" aria-live="polite"><b id="orbNum">0</b><span>secrets veiled</span></div>
    <div id="hubLine">
      <p id="hubStatus"></p>
      <p id="hubSub"></p>
      <button id="wake" class="tbtn primary" type="button"></button>
    </div>
    <div id="sats"></div>
    <p id="hint">click the veil &nbsp;·&nbsp; press <kbd>/</kbd> to speak a command &nbsp;·&nbsp; <kbd>1</kbd>–<kbd>7</kbd> to jump</p>
  </main>

  <div id="scrim"></div>
  <section id="room" hidden aria-live="polite">
    <header id="roomHead"><button id="back" class="tbtn" type="button">← the veil</button><nav id="roomNav" aria-label="Rooms"></nav></header>
    <div id="roomBody"></div>
  </section>

  <div id="decision" hidden role="alertdialog" aria-labelledby="decTitle">
    <p class="kicker">Veil is holding a request</p>
    <h2 id="decTitle"></h2>
    <p id="decBody" class="note"></p>
    <div class="row"><button id="decYes" class="tbtn primary" type="button">Send it veiled</button><button id="decNo" class="tbtn" type="button">Refuse</button></div>
  </div>

  <div id="cmd" hidden role="dialog" aria-label="Command">
    <input id="cmdIn" type="text" placeholder="say what you want…" spellcheck="false" autocomplete="off" aria-controls="cmdList">
    <ul id="cmdList" role="listbox"></ul>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="link" hidden>lost the thread — reconnecting…</div>
  <div id="demoTag" hidden>demo data · no backend attached</div>
  <div id="boot"><span>VEIL</span></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
